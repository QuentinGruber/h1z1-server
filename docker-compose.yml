
services:
  mongodb:
    image: mongo:6.0
    restart: unless-stopped
    command: ["mongod", "--auth"]
    volumes:
      - mongodb-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: h1server
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: "REDACTED"
    ports:
      - "127.0.0.1:27018:27017"

  login-server:
    build:
      context: .
      dockerfile: docker/2015/LoginServer.Dockerfile
    depends_on:
      - mongodb
    environment:
      MONGO_URL: mongodb://127.0.0.1:27018/h1server

      # Original working public server setting
      SOLO_PLAY_IP: "127.0.0.1"

      # New public server configuration
      PUBLIC_SERVER_IP: ${PUBLIC_SERVER_IP:-127.0.0.1}
      PUBLIC_SERVER_PORT: ${PUBLIC_SERVER_PORT:-1117}
      PUBLIC_SERVER_WORLD_ID: "2"

      DEBUG: "*"
      TZ: Europe/London

    # Preserve original working VPS networking
    network_mode: host
    restart: unless-stopped

  zone-server-2016:
    build:
      context: .
      dockerfile: docker/2016/ZoneServer.Dockerfile
    depends_on:
      - mongodb
      - login-server
    environment:
      MONGO_URL: mongodb://127.0.0.1:27018/h1server

      WORLD_ID: "2"
      LOGINSERVER_IP: "127.0.0.1"
      LZ_SERVER_SECRET_FILE: /run/secrets/zone-server-2016

      DEBUG: "ZoneServer,WsLoginConnection"
      TZ: Europe/London

    # Preserve original working VPS networking
    network_mode: host

    # Persistent, editable server configuration
    volumes:
      - ./config.yaml:/usr/src/app/config.yaml

    secrets:
      - zone-server-2016

    restart: unless-stopped
    profiles:
      - "2016"

  zone-server-2015:
    build:
      context: .
      dockerfile: docker/2015/ZoneServer.Dockerfile
    depends_on:
      - mongodb
      - login-server
    environment:
      MONGO_URL: mongodb://127.0.0.1:27018/h1server
      WORLD_ID: ${WORLD_ID:-0}
      LOGINSERVER_IP: "login-server"
      TZ: Europe/London
      DEBUG: ${DEBUG:-}

    restart: unless-stopped
    profiles:
      - "2015"

volumes:
  mongodb-data:

secrets:
  zone-server-2016:
    file: ./.zone-2016.secret
